name: Build vzlogger2mqtt

on:
  push:
    branches: [master]
    paths:
      - "vzlogger2mqtt/**"
      - ".github/workflows/build-vzlogger2mqtt.yml"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7, armhf]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read build metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' vzlogger2mqtt/config.json)
          BUILD_FROM=$(jq -r ".build_from.${{ matrix.arch }}" vzlogger2mqtt/build.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_from=${BUILD_FROM}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: vzlogger2mqtt
          push: true
          tags: |
            mreuter/${{ matrix.arch }}-vzlogger2mqtt:${{ steps.meta.outputs.version }}
            mreuter/${{ matrix.arch }}-vzlogger2mqtt:latest
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.build_from }}
          cache-from: type=gha,scope=${{ matrix.arch }}-vzlogger2mqtt
          cache-to: type=gha,scope=${{ matrix.arch }}-vzlogger2mqtt,mode=max
